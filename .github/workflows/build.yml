name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --noconsole --name "BDO Weekly Tracker" bdo-weekly-tracker.py

      - name: Update version.json
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          printf '{"version": "%s"}' "$VERSION" > version.json
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add version.json
          git commit -m "chore: bump version.json to $VERSION" || echo "No changes to commit"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BDO Weekly Tracker.exe
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}